name: Deploy Catherine to Fly.io

on:
  push:
    branches:
      - release-production-branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: catherine-prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Fly.io Runtime Secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set \
            --app catherine \
            AWS_PRIVATE_BUCKET_NAME="${{ vars.AWS_PRIVATE_BUCKET_NAME }}" \
            AWS_PUBLIC_BUCKET_NAME="${{ vars.AWS_PUBLIC_BUCKET_NAME }}" \
            AWS_REGION="${{ vars.AWS_REGION }}" \
            AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            MONGO_CONNECTION_STRING="${{ secrets.MONGO_CONNECTION_STRING }}" \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            FIREBASE_CREDENTIAL="${{ secrets.FIREBASE_CREDENTIAL }}"\
            REACT_BASE_URL="${{ vars.REACT_BASE_URL }}" \
            API_ENDPOINT="${{ vars.API_ENDPOINT }}" \
            MONGO_DB_NAME="${{ vars.MONGO_DB_NAME }}"\
            AUTH_DOMAIN="${{ vars.AUTH_DOMAIN }}"\
            CRON_SECRET="${{ secrets.CRON_SECRET }}"\

      - name: Build and Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app catherine \
            --config packages/catherine/fly.toml \
            --dockerfile Dockerfile \
            --build-arg APP_NAME=catherine \
            --build-secret GIT_MANAGE_NPM_TOKEN=${{ secrets.GIT_MANAGE_NPM_TOKEN }} \
            --build-arg VITE_REACT_BASE_URL="${{ vars.VITE_REACT_BASE_URL }}" \
            --build-arg VITE_APIDOMAIN="${{ vars.VITE_APIDOMAIN }}" \
            --build-arg VITE_API_ENDPOINT="${{ vars.VITE_API_ENDPOINT }}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_EMAIL_DOMAIN="${{ vars.VITE_EMAIL_DOMAIN }}" \
            --build-arg VITE_AUTH_DOMAIN="${{ vars.VITE_AUTH_DOMAIN }}" \
            --build-arg VITE_S3_PUBLIC_URL="${{ vars.VITE_S3_PUBLIC_URL }}" \
            --remote-only

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Successfully deployed catherine to catherine"
          echo "🔗 URL: https://catherine-example.fly.dev"